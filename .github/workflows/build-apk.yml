name: Build Durak Tracker APK
on:
  workflow_dispatch:
  push:
    branches: [ "main" ]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 21 }
      - name: Install Capacitor and generate Android project
        run: |
          - name: Prepare web assets
  run: |
    mkdir -p www
    cp index.html www/index.htmlnpm install @capacitor/core @capacitor/cli @capacitor/android
          npx cap add android
          npx cap sync android
      - name: Add native floating overlay
        run: bash scripts/prepare-android.sh
      - name: Build APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: Durak-Tracker-Overlay-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
